# PowerSync Open Edition (profil mobile-hors-ligne, ADR-0004).
# Réplique PostgreSQL (wal_level=logical) ; stockage interne sur PostgreSQL.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URL
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URL
  sslmode: disable

port: 8080

# Même jeton OIDC que l'API (ADR-0005).
client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: [!env PS_AUDIENCE]
  # Keycloak est joint par le réseau Docker interne.
  block_local_jwks: false

# Sous-ensemble présent sur le téléphone : les initiatives dont je suis membre.
# À adapter au démarrage de chaque application (6ᵉ information du skill).
sync_rules:
  content: |
    bucket_definitions:
      my_initiatives:
        parameters: SELECT initiative_id FROM initiative_member WHERE user_id = request.user_id()
        data:
          - SELECT id, code, name, created_by, created_at FROM initiative WHERE id = bucket.initiative_id
          - SELECT initiative_id || ':' || user_id AS id, initiative_id, user_id, role, is_team_ba FROM initiative_member WHERE initiative_id = bucket.initiative_id

telemetry:
  disable_telemetry_sharing: true
